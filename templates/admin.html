<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Tube - 관리자 센터 & 방문자 통계</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #050b1a;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(14, 165, 233, 0.2) 0%, transparent 40%);
            background-attachment: fixed;
        }
        .cosmic-glass {
            background: rgba(13, 23, 49, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- 상단 헤더 -->
        <div class="flex items-center justify-between mb-8 pb-4 border-b border-slate-800">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold flex items-center gap-2 text-cyan-400">
                    <i class="fa-solid fa-chart-line"></i> Cosmic Tube 관리자 대시보드
                </h1>
                <p class="text-xs text-slate-400 mt-1">실시간 일일 방문자 수와 회원 통계를 모니터링합니다.</p>
            </div>
            <a href="/" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 transition flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> 메인 화면으로 이동
            </a>
        </div>

        <!-- [신규] 핵심 통계 지표 카드 -->
        <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-8">
            <div class="cosmic-glass p-5 rounded-2xl border border-cyan-500/30">
                <p class="text-xs text-slate-400 mb-1 flex items-center gap-1.5">
                    <i class="fa-solid fa-user-check text-cyan-400"></i> 오늘 순 방문자 (DAU)
                </p>
                <h3 id="stat-today-visitors" class="text-3xl font-black text-cyan-300">- 명</h3>
                <span class="text-[10px] text-slate-500">IP 중복 제거된 순수 방문자</span>
            </div>

            <div class="cosmic-glass p-5 rounded-2xl border border-indigo-500/30">
                <p class="text-xs text-slate-400 mb-1 flex items-center gap-1.5">
                    <i class="fa-solid fa-bolt text-indigo-400"></i> 오늘 서비스 이용 건수
                </p>
                <h3 id="stat-today-actions" class="text-3xl font-black text-indigo-300">- 회</h3>
                <span class="text-[10px] text-slate-500">대본 추출 및 다운로드 실행 수</span>
            </div>

            <div class="cosmic-glass p-5 rounded-2xl border border-emerald-500/30">
                <p class="text-xs text-slate-400 mb-1 flex items-center gap-1.5">
                    <i class="fa-solid fa-users text-emerald-400"></i> 총 가입 회원수
                </p>
                <h3 id="stat-total-users" class="text-3xl font-black text-emerald-300">- 명</h3>
                <span class="text-[10px] text-slate-500">무제한 이용 등록 계정</span>
            </div>

            <div class="cosmic-glass p-5 rounded-2xl border border-purple-500/30">
                <p class="text-xs text-slate-400 mb-1 flex items-center gap-1.5">
                    <i class="fa-solid fa-eye text-purple-400"></i> 누적 총 방문 수
                </p>
                <h3 id="stat-total-visits" class="text-3xl font-black text-purple-300">- 회</h3>
                <span class="text-[10px] text-slate-500">사이트 오픈 이래 총 누적치</span>
            </div>
        </div>

        <!-- [신규] 최근 7일간 일별 방문자 추이 표 -->
        <div class="cosmic-glass rounded-3xl p-6 mb-8 border border-slate-800 shadow-2xl">
            <h2 class="font-bold text-base text-slate-200 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-calendar-days text-cyan-400"></i> 최근 7일간 일별 방문자 추이
            </h2>
            <div id="trends-container" class="grid grid-cols-2 sm:grid-cols-7 gap-3 text-center">
                <p class="text-xs text-slate-500 col-span-full py-4">방문 통계를 집계하고 있습니다...</p>
            </div>
        </div>

        <!-- 회원 관리 테이블 -->
        <div class="cosmic-glass rounded-3xl overflow-hidden border border-slate-800 shadow-2xl">
            <div class="p-6 border-b border-slate-800 flex items-center justify-between">
                <h2 class="font-bold text-base text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-user-gear text-cyan-400"></i> 회원 계정 관리
                </h2>
                <button onclick="loadAdminData()" class="text-xs text-cyan-400 hover:underline flex items-center gap-1">
                    <i class="fa-solid fa-rotate"></i> 새로고침
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-950/80 text-slate-400 uppercase text-[11px] border-b border-slate-800">
                        <tr>
                            <th class="py-3.5 px-6">ID</th>
                            <th class="py-3.5 px-6">이메일</th>
                            <th class="py-3.5 px-6">가입일</th>
                            <th class="py-3.5 px-6">상태</th>
                            <th class="py-3.5 px-6 text-center">관리</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body" class="divide-y divide-slate-800/60">
                        <tr>
                            <td colspan="5" class="text-center py-8 text-slate-500">회원 정보를 불러오는 중입니다...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadAdminData() {
            try {
                // 1. 통계 데이터 호출
                const statRes = await fetch('/api/admin/stats');
                if (statRes.ok) {
                    const stats = await statRes.json();
                    document.getElementById('stat-today-visitors').innerText = `${stats.today_visitors} 명`;
                    document.getElementById('stat-today-actions').innerText = `${stats.today_actions} 회`;
                    document.getElementById('stat-total-visits').innerText = `${stats.total_visits} 회`;

                    const trendBox = document.getElementById('trends-container');
                    if (stats.daily_trends && stats.daily_trends.length) {
                        trendBox.innerHTML = stats.daily_trends.map(t => `
                            <div class="p-3 rounded-xl bg-slate-900/60 border border-slate-800">
                                <span class="text-[11px] text-slate-400 block mb-1 font-mono">${t.date.slice(5)}</span>
                                <span class="text-base font-black text-cyan-400">${t.count}명</span>
                            </div>
                        `).join('');
                    } else {
                        trendBox.innerHTML = `<p class="text-xs text-slate-500 col-span-full py-2">오늘 첫 방문 기록이 시작되었습니다.</p>`;
                    }
                }

                // 2. 회원 목록 호출
                const userRes = await fetch('/api/admin/users');
                if (userRes.ok) {
                    const users = await userRes.json();
                    document.getElementById('stat-total-users').innerText = `${users.length} 명`;

                    const tbody = document.getElementById('user-table-body');
                    if (!users.length) {
                        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-500">가입된 회원이 없습니다.</td></tr>`;
                        return;
                    }

                    tbody.innerHTML = users.map(u => `
                        <tr class="hover:bg-slate-900/40 transition">
                            <td class="py-3.5 px-6 font-mono text-slate-400">${u.id}</td>
                            <td class="py-3.5 px-6 font-semibold text-slate-100">${u.email}</td>
                            <td class="py-3.5 px-6 text-slate-400">${u.created_at.split(' ')[0]}</td>
                            <td class="py-3.5 px-6">
                                ${u.is_banned ? '<span class="px-2 py-0.5 rounded text-[11px] font-bold bg-rose-500/20 text-rose-400">정지</span>' : '<span class="px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-500/20 text-emerald-400">정상</span>'}
                            </td>
                            <td class="py-3.5 px-6 text-center space-x-1.5">
                                ${u.is_admin ? '<span class="text-slate-600 text-[11px]">관리자</span>' : `
                                    <button onclick="toggleBan(${u.id})" class="px-2.5 py-1 rounded-lg text-xs font-semibold ${u.is_banned ? 'bg-emerald-600/30 text-emerald-300' : 'bg-amber-600/30 text-amber-300'}">
                                        ${u.is_banned ? '해제' : '정지'}
                                    </button>
                                `}
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function toggleBan(userId) {
            if (!confirm('이용 상태를 변경하시겠습니까?')) return;
            const res = await fetch(`/api/admin/users/${userId}/toggle-ban`, { method: 'POST' });
            if (res.ok) loadAdminData();
        }

        window.onload = loadAdminData;
    </script>
</body>
</html>
